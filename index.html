```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 40px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      font-size: 18px;
      margin-bottom: 24px;
      border: 2px solid #ddd;
      border-radius: 8px;
    }

    .tip-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tip-button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background: white;
      color: black;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
    }

    .tip-button.selected {
      background: #e63946;
      color: white;
      border-color: #e63946;
    }

    #split-button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #e63946;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #result {
      margin-top: 32px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Bill Splitter</h1>

  <label for="bill">Total Bill</label>
  <input type="number" id="bill" placeholder="e.g. 100">

  <label for="people">Number of People</label>
  <input type="number" id="people" placeholder="e.g. 4">

  <label>Tip</label>

  <div class="tip-buttons">
    <button class="tip-button" onclick="selectTip(10, this)">10%</button>
    <button class="tip-button" onclick="selectTip(15, this)">15%</button>
    <button class="tip-button" onclick="selectTip(20, this)">20%</button>
  </div>

  <button id="split-button" onclick="splitBill()">Split Bill</button>

  <div id="result"></div>

  <script>
    let tip = 0;

    function selectTip(value, button) {
      tip = value;

      document.querySelectorAll(".tip-button").forEach(function(button) {
        button.classList.remove("selected");
      });

      button.classList.add("selected");
    }

    function splitBill() {
      const bill = document.getElementById("bill").value;
      const people = document.getElementById("people").value;

      const total = bill * (1 + tip / 100);
      const eachPerson = total / people;

      document.getElementById("result").textContent =
        "Each person pays $" + eachPerson.toFixed(2);
    }
  </script>

</body>
</html>
