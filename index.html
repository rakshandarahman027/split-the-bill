<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 40px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      font-size: 18px;
      margin-bottom: 24px;
      border: 2px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #e63946;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #result {
      margin-top: 32px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Bill Splitter</h1>

  <label for="bill">Total Bill</label>
  <input type="number" id="bill" placeholder="e.g. 100">

  <label for="people">Number of People</label>
  <input type="number" id="people" placeholder="e.g. 4">

  <button onclick="splitBill()">Split Bill</button>

  <div id="result"></div>

  <script>
    function splitBill() {
      const bill = document.getElementById("bill").value;
      const people = document.getElementById("people").value;

      const eachPerson = bill / people;

      document.getElementById("result").textContent =
        "Each person pays $" + eachPerson.toFixed(2);
    }
  </script>

</body>
</html>
